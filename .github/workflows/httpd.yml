name: httpd instrumentation CI

on:
  workflow_dispatch:
  push:
    branches: 
      - 'main'
    paths:
      - 'instrumentation/httpd/**'
      - 'cmake/**'
      - '.github/workflows/httpd.yml'
      - 'apt-packages.txt'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'instrumentation/httpd/**'
      - 'cmake/**'
      - '.github/workflows/httpd.yml'
      - 'apt-packages.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }} # Ensure that only one instance of this workflow is running per Pull Request/branch/ref
  cancel-in-progress: true # Cancel any previous runs of this workflow

jobs:
  Bazel:
    uses: $/.github/workflows/ci-bazel.yml
    with:
      install-apt-packages: true
      oses: '["ubuntu-26.04"]'
      working-directory: instrumentation/httpd

  CMake:
    uses: $/.github/workflows/ci-cmake.yml
    with:
      oses: '["ubuntu-26.04"]'
      working-directory: instrumentation/httpd

  conan:
    uses: $/.github/workflows/ci-conan.yml
    with:
      install-apt-packages: true
      oses: '["ubuntu-26.04"]'
      working-directory: instrumentation/httpd

  vcpkg:
    uses: $/.github/workflows/ci-vcpkg.yml
    with:
      install-apt-packages: true
      oses: '["ubuntu-26.04"]'
      working-directory: instrumentation/httpd

  e2e_tests:
    name: CMake / end-to-end tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup dependencies
        working-directory: instrumentation/httpd
        run: |
          sudo apt update -y
          xargs -a ../../apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
          xargs -a apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
          xargs -a tests/apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
      - name: Run tests
        working-directory: instrumentation/httpd
        run: |
          cd tests
          chmod +x perform-e2e.sh
          sudo ./perform-e2e.sh
