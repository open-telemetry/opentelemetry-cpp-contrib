name: user_events 

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'exporters/user_events/**'
      - '.github/workflows/user_events.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'exporters/user_events/**'
      - '.github/workflows/user_events.yml'

permissions:
  contents: read

jobs:
  cmake_linux:
    name: CMake Linux
    runs-on: ubuntu-24.04
    steps:
      - name: checkout opentelemetry-cpp-contrib
        uses: actions/checkout@v7.0.1
        with:
          submodules: "recursive"
      - name: setup dependencies
        working-directory: exporters/user_events
        run: |
          sudo apt update -y
          xargs -a apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
      - name: run tests
        working-directory: exporters/user_events
        run: |
          mkdir -p "build"
          cd "build"
          cmake .. -G Ninja -D OPENTELEMETRY_EXTERNAL_COMPONENT_PATH=$GITHUB_WORKSPACE/exporters/user_events -D WITH_OTLP_HTTP=ON
          cmake --build . -j$(nproc)
          ctest -j1 --output-on-failure
