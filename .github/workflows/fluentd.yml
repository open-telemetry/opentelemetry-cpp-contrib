name: Fluentd exporter CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'exporters/fluentd/**'
      - '.github/workflows/fluentd.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'exporters/fluentd/**'
      - '.github/workflows/fluentd.yml'

permissions:
  contents: read

jobs:
  cmake_linux:
    name: CMake Linux
    runs-on: ubuntu-24.04
    steps:
      - name: checkout opentelemetry-cpp-contrib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: opentelemetry-cpp-contrib
          submodules: "recursive"
      - name: checkout opentelemetry-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "open-telemetry/opentelemetry-cpp"
          ref: "v1.21.0"
          path: "opentelemetry-cpp"
          submodules: "recursive"
      - name: setup dependencies
        working-directory: opentelemetry-cpp-contrib/exporters/fluentd
        run: |
          sudo apt update -y
          xargs -a apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
      - name: build and test
        run: |
          sudo $GITHUB_WORKSPACE/opentelemetry-cpp/ci/setup_googletest.sh
          mkdir -p "$GITHUB_WORKSPACE/opentelemetry-cpp/build"
          cd "$GITHUB_WORKSPACE/opentelemetry-cpp/build"
          cmake .. -G Ninja -D OPENTELEMETRY_EXTERNAL_COMPONENT_PATH=$GITHUB_WORKSPACE/opentelemetry-cpp-contrib/exporters/fluentd 
          cmake --build . -j$(nproc)
          ctest -j1 --output-on-failure
      - name: build opentelemetry-cpp
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/opentelemetry-cpp/build"
          cd "${GITHUB_WORKSPACE}/opentelemetry-cpp/build"
          cmake .. -G Ninja -DBUILD_TESTING=OFF -DWITH_BENCHMARK=OFF -DOPENTELEMETRY_INSTALL=ON
          cmake --build . -j$(nproc)
          cmake --install . --prefix="${GITHUB_WORKSPACE}/sandbox"
      - name: build exporters/fluentd contrib
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/exporters-fluentd/build"
          cd "${GITHUB_WORKSPACE}/exporters-fluentd/build"
          cmake ../../opentelemetry-cpp-contrib/exporters/fluentd \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sandbox" \
            -DBUILD_TESTING=ON \
            -DWITH_EXAMPLES=ON \
            -DOPENTELEMETRY_INSTALL=ON
          cmake --build . -j$(nproc)
          ctest -j1 --output-on-failure
          cmake --install . --prefix="${GITHUB_WORKSPACE}/sandbox"
