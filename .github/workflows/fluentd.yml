name: Fluentd exporter CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'exporters/fluentd/**'
      - 'cmake/**'
      - '.github/workflows/ci-*.yml'
      - '.github/workflows/fluentd.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'exporters/fluentd/**'
      - 'cmake/**'
      - '.github/workflows/ci-*.yml'
      - '.github/workflows/fluentd.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }} # Ensure that only one instance of this workflow is running per Pull Request/branch/ref
  cancel-in-progress: true # Cancel any previous runs of this workflow

jobs:
  CMake:
    uses: $/.github/workflows/ci-cmake.yml
    with:
      working-directory: exporters/fluentd
