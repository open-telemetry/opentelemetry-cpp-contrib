name: prometheus instrumentation CI

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "exporters/prometheus/**"
      - ".github/workflows/prometheus.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "exporters/prometheus/**"
      - ".github/workflows/prometheus.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }} # Ensure that only one instance of this workflow is running per Pull Request/branch/ref
  cancel-in-progress: true # Cancel any previous runs of this workflow

jobs:
  prometheus_bazel_linux:
    name: Bazel on Linux
    runs-on: ubuntu-latest
    steps:
      - name: checkout otel contrib prometheus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: "otel_cpp_contrib"
      - name: Mount Bazel Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: bazel_cache
        with:
          path: /home/runner/.cache/bazel
          key: bazel_linux
      - name: run build
        working-directory: otel_cpp_contrib/exporters/prometheus
        run: |
          bazel --output_user_root=$HOME/.cache/bazel build --@io_opentelemetry_cpp//api:with_abseil //...
          bazel --output_user_root=$HOME/.cache/bazel test --test_output=all --@io_opentelemetry_cpp//api:with_abseil //...
  prometheus_bazel_osx:
    name: Bazel on MacOS
    runs-on: macos-latest
    steps:
      - name: checkout otel contrib prometheus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: "otel_cpp_contrib"
      - name: Mount Bazel Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: bazel_cache
        with:
          path: /Users/runner/.cache/bazel
          key: bazel_osx
      - name: run tests
        working-directory: otel_cpp_contrib/exporters/prometheus
        run: |
          bazel --output_user_root=$HOME/.cache/bazel build --@io_opentelemetry_cpp//api:with_abseil //...
          bazel --output_user_root=$HOME/.cache/bazel test --test_output=all --@io_opentelemetry_cpp//api:with_abseil //...
  prometheus_cmake_window:
    name: CMake on Windows
    runs-on: windows-2025
    steps:
      - name: checkout otel contrib prometheus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: "otel_cpp_contrib"
      - name: checkout otel cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "open-telemetry/opentelemetry-cpp"
          ref: "v1.29.0"
          path: "otel_cpp"
          submodules: "recursive"
      - name: run tests
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          vcpkg install "prometheus-cpp[pull,push]" nlohmann-json gtest benchmark --triplet=x64-windows-static-md
          New-Item -Path "$ENV:GITHUB_WORKSPACE/otel_cpp/build_jobs_ci" -ItemType "directory" -Force 
          Set-Location "$ENV:GITHUB_WORKSPACE/otel_cpp/build_jobs_ci"
          cmake .. -DOTELCPP_WITH_PROMETHEUS=ON -DCMAKE_BUILD_TYPE=Debug `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DCMAKE_TOOLCHAIN_FILE=$ENV:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_INSTALL_PREFIX=$HOME/prebuilt-otel" `
            "-DBUILD_SHARED_LIBS=OFF" "-DBUILD_TESTING=OFF" "-DOTELCPP_WITH_EXAMPLES=OFF" "-DOTELCPP_WITH_FUNC_TESTS=OFF"
          cmake --build . -j --config Debug || cmake --build . -j2 --config Debug || cmake --build . --config Debug
          cmake --install . --prefix "$HOME/prebuilt-otel" --config Debug
          New-Item -Path "$ENV:GITHUB_WORKSPACE/otel_cpp_contrib/exporters/prometheus/build_jobs_ci" -ItemType "directory" -Force
          Set-Location "$ENV:GITHUB_WORKSPACE/otel_cpp_contrib/exporters/prometheus/build_jobs_ci"
          cmake .. "-DCMAKE_PREFIX_PATH=$HOME/prebuilt-otel" -DCMAKE_BUILD_TYPE=Debug `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DCMAKE_TOOLCHAIN_FILE=$ENV:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_MANIFEST_MODE=OFF" `
            "-DBUILD_SHARED_LIBS=OFF"
          cmake --build . -j --config Debug || cmake --build . -j2 --config Debug || cmake --build . --config Debug
          ctest -VV -C Debug -R "opentelemetry_cpp_ecosystem_test.*" .
  prometheus_cmake_linux:
    name: CMake on Linux
    runs-on: ubuntu-latest
    steps:
      - name: checkout otel contrib prometheus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: "otel_cpp_contrib"
      - name: checkout otel cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "open-telemetry/opentelemetry-cpp"
          ref: "v1.29.0"
          path: "otel_cpp"
          submodules: "recursive"
      - name: setup
        working-directory: otel_cpp_contrib/exporters/prometheus
        run: |
          sudo apt update -y 
          xargs -a apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
          # Install both features before OpenTelemetry can build a pull-only dependency.
          vcpkg install "prometheus-cpp[pull,push]" --triplet=x64-linux --classic
      - name: run tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/otel_cpp/build_jobs_ci"
          cd "$GITHUB_WORKSPACE/otel_cpp/build_jobs_ci"
          cmake .. -DOTELCPP_WITH_PROMETHEUS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DCMAKE_INSTALL_PREFIX=$HOME/prebuilt-otel" \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            "-DBUILD_TESTING=OFF" "-DOTELCPP_WITH_EXAMPLES=OFF" "-DOTELCPP_WITH_FUNC_TESTS=OFF"
          cmake --build . -j --config Debug || cmake --build . -j2 --config Debug || cmake --build . --config Debug
          cmake --install . --prefix "$HOME/prebuilt-otel" --config Debug
          mkdir -p "$GITHUB_WORKSPACE/otel_cpp_contrib/exporters/prometheus/build_jobs_ci"
          cd "$GITHUB_WORKSPACE/otel_cpp_contrib/exporters/prometheus/build_jobs_ci"
          cmake .. "-DCMAKE_PREFIX_PATH=$HOME/prebuilt-otel" -DCMAKE_BUILD_TYPE=Debug \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_MANIFEST_MODE=OFF"
          cmake --build . -j --config Debug || cmake --build . -j2 --config Debug || cmake --build . --config Debug
          ctest -VV -R "opentelemetry_cpp_ecosystem_test.*" .
