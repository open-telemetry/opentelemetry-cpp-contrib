name: Bazel

on:
  workflow_call:
    inputs:
      install-apt-packages:
        type: boolean
        required: false
        default: false
      oses:
        type: string
        required: false
        default: '["macos-26","ubuntu-26.04","windows-2025"]'
      working-directory:
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    steps:
      - name: checkout otel contrib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          module-root: ${{ inputs.working-directory }}
          bazelisk-cache: false
          repository-cache: false
      - name: Mount Bazel Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: bazel_cache
        with:
          path: /home/runner/.cache/bazel
          key: bazel_${{ matrix.os }}
      - name: Install system deps
        uses: $/.github/actions/setup_env
        with:
          install-apt-packages: ${{ inputs.install-apt-packages }}
          working-directory: ${{ inputs.working-directory }}
      - name: run build
        working-directory: ${{ inputs.working-directory }}
        run: |
          bazel --output_user_root=$HOME/.cache/bazel build //...
      - name: run tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if bazel query 'tests(//...)' | grep -q .; then
            bazel --output_user_root="$HOME/.cache/bazel" test //...
          else
            echo "No tests found, skipping."
          fi
