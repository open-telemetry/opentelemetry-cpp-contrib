name: Bazel

on:
  workflow_call:
    inputs:
      install-apt-packages:
        type: boolean
        required: false
        default: false
      working-directory:
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: checkout otel contrib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: ${{ inputs.working-directory }}
          bazelisk-cache: true
          repository-cache: true
      - name: Mount Bazel Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: bazel_cache
        with:
          path: /home/runner/.cache/bazel
          key: bazel_${{ matrix.os }}
      - name: Install system deps [Linux]
        if: runner.os == 'Linux'
        working-directory: ${{ inputs.working-directory }}
        run: |
          sudo apt update -y 
        env:
          INSTALL_APT_PACKAGES: ${{ inputs.install-apt-packages }}
        run: |
          if [[ "$INSTALL_APT_PACKAGES" == "true" ]]; then
            xargs -a ../../apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
          fi
      - name: run build
        working-directory: ${{ inputs.working-directory }}
        run: |
          bazel --output_user_root=$HOME/.cache/bazel build //...
      - name: run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          bazel --output_user_root=$HOME/.cache/bazel test //...
