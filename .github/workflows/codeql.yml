name: Codeql

on:
  push:
    branches:
      - 'main'
    paths:
      - 'exporters/**'
      - 'instrumentation/**'
      - 'cmake/**'
      - '.github/workflows/codeql.yml'
      - 'apt-package.txt'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'exporters/**'
      - 'instrumentation/**'
      - 'cmake/**'
      - '.github/workflows/codeql.yml'
      - 'apt-package.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }} # Ensure that only one instance of this workflow is running per Pull Request/branch/ref
  cancel-in-progress: true # Cancel any previous runs of this workflow

jobs:
  discover-configs:
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - name: checkout otel contrib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        name: find codeql config
        run: |
          # Find all codeql-config.yml files
          dirs=$(find . -type f -name "codeql-config.yml" -printf '%P\n' | xargs -r dirname)

          # Convert to JSON array
          json=$(printf '%s\n' "$dirs" | jq -R . | jq -s .)
          {
            echo "dirs<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-otel:
    name: "Pre-build otel"
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: checkout opentelemetry-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-telemetry/opentelemetry-cpp
          ref: v1.28.0
          persist-credentials: false
      - name: setup dependencies
        run: |
          cat > otel-apt-packages.txt <<'EOF'
          build-essential
          cmake
          ninja-build
          libgrpc++-dev
          libssl-dev
          libcurl4-openssl-dev
          libprotobuf-dev
          protobuf-compiler
          protobuf-compiler-grpc
          EOF

          sudo apt update -y
          xargs -a otel-apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
      - name: build opentelemetry-cpp
        run: |
          cmake -S . -B .cmake-build \
            -G Ninja \
            -DBUILD_TESTING=OFF \
            -DWITH_BENCHMARK=OFF \
            -DWITH_OTLP_GRPC=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DOPENTELEMETRY_INSTALL=ON

          cmake --build .cmake-build -j"$(nproc)"
          cmake --install .cmake-build --prefix="${GITHUB_WORKSPACE}/sandbox"
      - name: upload sandbox
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otel-install
          path: |
            sandbox/
            otel-apt-packages.txt

  Codeql-build:
    permissions:
      security-events: write # for github/codeql-action/analyze to upload SARIF results
    name: "static-analysis / ${{ matrix.working-directory }}"
    needs:
      - discover-configs
      - build-otel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        working-directory: ${{ fromJson(needs.discover-configs.outputs.dirs) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: checkout otel contrib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: download otel install
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otel-install
          path: .
      - name: Setup dependencies
        working-directory: "${{ matrix.working-directory }}"
        run: |
          sudo apt update -y
          xargs -a ../../apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
          xargs -a apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
          xargs -a ../../otel-apt-packages.txt sudo apt install -y --no-install-recommends --no-install-suggests
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          config-file: "${{ matrix.working-directory }}/codeql-config.yml"
          languages: cpp
      - name: Build package
        working-directory: "${{ matrix.working-directory }}"
        run: |
          cmake -S . -B .cmake-build \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sandbox" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DWITH_BENCHMARK=OFF \
            -DWITH_EXAMPLES=OFF
          cmake --build .cmake-build -j"$(nproc)"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "${{ matrix.working-directory }}"
