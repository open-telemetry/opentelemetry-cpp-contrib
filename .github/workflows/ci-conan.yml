name: Conan

on:
  workflow_call:
    inputs:
      install-apt-packages:
        type: boolean
        required: false
        default: false
      oses:
        type: string
        required: false
        default: '["macos-26","ubuntu-26.04","windows-2025"]'
      working-directory:
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and setup Conan
        id: setup-conan
        uses: conan-io/setup-conan@5db0275587014d13a5ca698db681ce4782a6e052 # v1.5.0
        with:
          cache_packages: false
      - name: Cache packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-conan.outputs.conan-home }}/p
          key: conan-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/conanfile.txt', inputs.working-directory))}}
          restore-keys: |
            conan-${{ runner.os }}-${{ inputs.working-directory }}-
      - name: Install system deps
        uses: $/.github/actions/setup_env
        with:
          install-apt-packages: ${{ inputs.install-apt-packages }}
          working-directory: ${{ inputs.working-directory }}
      - name: Install dependencies from manifest
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          conan install . --output-folder=.cmake-build --build=missing  -s build_type=Debug -s:h compiler.cppstd=17 -s:b compiler.cppstd=17
      - name: Configure (CMake + Conan toolchain)
        uses: $/.github/actions/generate_cmake
        with:
          toolchain: .cmake-build/conan_toolchain.cmake
          working-directory: ${{ inputs.working-directory }}
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: |
          cmake --build .cmake-build -j"$(nproc)"
      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: |
          ctest --test-dir .cmake-build -VV
      - name: Cleanup
        working-directory: ${{ inputs.working-directory }}
        shell: pwsh
        run: |
          $conanHome = conan config home
          $size = (Get-ChildItem $conanHome -Recurse -File |
                   Measure-Object Length -Sum).Sum
          Write-Host ("Size: {0:N2} GiB" -f ($size / 1GB))
          conan cache clean "*"
          conan remove "*" --lru=3h -c
          $size = (Get-ChildItem $conanHome -Recurse -File |
                   Measure-Object Length -Sum).Sum
          Write-Host ("Size: {0:N2} GiB" -f ($size / 1GB))

