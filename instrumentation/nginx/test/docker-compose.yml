services:
  collector:
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ${TEST_ROOT:-.}/conf/collector.yml:/etc/otel/config.yml
      - ${TEST_ROOT:-.}/data/trace.json:/trace.json
    ports:
      - "4318:4318"
      - "13133:13133" # health check
  nginx:
    image: otel-nginx-test/nginx:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 1s
      timeout: 1s
      start_period: 10s
      retries: 300
    volumes:
      - ${TEST_ROOT:-.}/conf/nginx.conf:/otel-nginx/nginx.conf
      - ${TEST_ROOT:-.}/conf/fastcgi_params:/etc/nginx/fastcgi_params
      - ${TEST_ROOT:-.}/backend/files:/var/www/html/files
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=collector:4318/v1/traces
    ports:
      - "8080:8080"
    command:
      - /nginx/sbin/nginx
      - -c
      - /otel-nginx/nginx.conf
    depends_on:
      - node-backend
      - php-backend
      - collector
  node-backend:
    image: otel-nginx-test/express-backend:latest
    command: node index.js
    volumes:
      - ${TEST_ROOT:-.}/backend/simple_express:/app
    ports:
      - "3500:3500"
  php-backend:
    image: php:8.5.12-fpm@sha256:f665ad19c093eee54db3a03c89102d6828b1bbf4f327689e5947a8686c6585a1
    volumes:
      - ${TEST_ROOT:-.}/backend/php/:/var/www/html/php
