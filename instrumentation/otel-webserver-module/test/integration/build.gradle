plugins {
    id 'java'
}

version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.48'
    implementation 'org.testng:testng:7.12.0'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.20'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.14.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.22'
    implementation group: 'javax.ws.rs', name: 'javax.ws.rs-api', version: '2.1.1'
    testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '6.1.0'
    testImplementation group: 'org.testng', name: 'testng', version: '7.12.0'
    testImplementation group: 'io.rest-assured', name: 'json-schema-validator', version: '6.1.0'
    implementation group: 'org.json', name: 'json', version: '20160810'

}

task integrationTests(type: Test) {
    useTestNG() {
        useDefaultListeners = true
        suites 'src/test/resources/testngsuites/testng.xml'
    }
}
